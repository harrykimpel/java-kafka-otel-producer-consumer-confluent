#spring.kafka.order.bootstrap-servers: localhost:9092
spring.kafka.order.topic.create-order: create-order
spring.kafka.order.topic.user: user
spring.kafka.order.consumer.group-id.notification: notification
spring.kafka.order.consumer.group-id.service: service
#spring.kafka.order.consumer.group-id.notification: notification-user

# Required connection configs for Kafka producer, consumer, and admin
#bootstrap.servers=${CONFLUENT_BOOTSTRAP_SERVERS}

# Best practice for Kafka producer to prevent data loss
acks=all

# Required connection configs for Kafka producer, consumer, and admin
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.bootstrap-servers=${CONFLUENT_BOOTSTRAP_SERVERS}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username='${CONFLUENT_API_KEY}' password='${CONFLUENT_API_SECRET}';
spring.kafka.properties.security.protocol=SASL_SSL

# Best practice for higher availability in Apache Kafka clients prior to 3.0
spring.kafka.properties.session.timeout.ms=45000

